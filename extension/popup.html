<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>mmco</title>
  <style>
    body { width: 320px; margin: 0; padding: 12px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2328; }
    h1 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .row { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; }
    .label { color: #59636e; flex: none; }
    .value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; text-align: right; }
    input, textarea { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 5px 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; border: 1px solid #d0d7de; border-radius: 6px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 6px 0; font-weight: 600; color: #fff; background: #0969da; border: 1px solid transparent; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #8c959f; cursor: default; }
    button.stop { background: #cf222e; display: none; }
    body[data-status="running"] button.stop { display: block; }
    .status { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #8c959f; box-sizing: border-box; }
    body[data-status="running"] .dot { border: 2px solid #c8d1da; border-top-color: #0969da; background: transparent; animation: spin 0.8s linear infinite; }
    body[data-status="done"] .dot { background: #1a7f37; }
    body[data-status="failed"] .dot { background: #cf222e; }
    body[data-status="stopped"] .dot { background: #59636e; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tabs { display: flex; gap: 4px; margin: 0 0 10px; border-bottom: 1px solid #d0d7de; }
    .tab { flex: none; padding: 4px 10px; margin-bottom: -1px; font-weight: 600; color: #59636e; background: none; border: 1px solid transparent; border-radius: 6px 6px 0 0; }
    .tab[aria-selected="true"] { color: #1f2328; border-color: #d0d7de; border-bottom-color: #fff; }
    [role="tabpanel"][hidden] { display: none; }
    pre { margin: 0; padding: 6px 8px; height: 260px; overflow: auto; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; color: #1f2328; background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    pre:empty::before { content: "No run output yet."; color: #59636e; }
    .hint { margin: 8px 0 0; color: #59636e; font-size: 12px; }
    .error { margin: 8px 0 0; color: #cf222e; font-size: 12px; }
    .error:empty { display: none; }
    textarea { resize: vertical; margin-top: 4px; }
    .section { margin-top: 12px; padding-top: 8px; border-top: 1px solid #d0d7de; }
    .section label { color: #59636e; }
    footer { margin-top: 12px; padding-top: 8px; border-top: 1px solid #d0d7de; display: flex; justify-content: space-between; font-size: 12px; }
    a { color: #0969da; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body data-status="none">
  <h1>mmco <span class="status"><span class="dot"></span><span id="status-text"></span></span></h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-control" aria-controls="panel-control" aria-selected="true">Control</button>
    <button class="tab" role="tab" id="tab-logs" aria-controls="panel-logs" aria-selected="false">Logs</button>
  </div>
  <div role="tabpanel" id="panel-control" aria-labelledby="tab-control">
  <div class="row"><span class="label">Repository</span><span class="value" id="repo">–</span></div>
  <div class="row"><span class="label">Branch</span><span class="value" id="branch">–</span></div>
  <div class="row"><span class="label">Phase</span><span class="value" id="phase">–</span></div>
  <input id="branch-input" placeholder="branch (empty = default branch)" spellcheck="false">
  <div class="actions">
    <button id="go" disabled>Checkout locally</button>
    <button id="stop" class="stop">Stop</button>
  </div>
  <p class="hint" id="hint"></p>
  <p class="error" id="error"></p>
  <div class="section">
    <label for="slack-template">Slack it message</label>
    <textarea id="slack-template" rows="2" spellcheck="false"></textarea>
    <p class="hint"><code>{url}</code> is replaced by the pull request link, each <code>{rdm}</code> by a random emoji. Empty = default.</p>
  </div>
  </div>
  <div role="tabpanel" id="panel-logs" aria-labelledby="tab-logs" hidden>
    <pre id="tail"></pre>
  </div>
  <footer>
    <a id="settings">Settings…</a>
    <a id="config">Config file</a>
    <a id="log">Log</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
